<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Instrument+Sans:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #050505; color: #FFFFFF; font-family: 'Tajawal', sans-serif; }
        .slide-container { 
            width: 1280px; 
            min-height: 720px; 
            position: relative; 
            overflow: hidden; 
            background: #050505;
        }
        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 1280px;
            height: 720px;
            object-fit: cover;
            opacity: 0.6;
        }
        .overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(5, 5, 5, 0.8) 100%);
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            height: 720px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 100px;
        }
        .gold-line {
            width: 80px;
            height: 2px;
            background: #D4AF37;
            margin-bottom: 40px;
        }
        .title {
            font-family: 'Playfair Display', serif;
            font-size: 84px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -0.02em;
            color: #FFFFFF;
        }
        .subtitle {
            font-family: 'Instrument Sans', sans-serif;
            font-size: 28px;
            font-weight: 400;
            color: #D4AF37;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            max-width: 900px;
            line-height: 1.6;
        }
        .logo-placeholder {
            position: absolute;
            top: 60px;
            right: 80px;
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #FFFFFF;
        }
        .footer-tag {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <img src="/home/ubuntu/wajd-repo/deck_cover.png" class="background-image" alt="Wajd Agency Cover">
        <div class="overlay"></div>
        
        <div class="logo-placeholder">WAJD</div>
        
        <div class="content">
            <div class="gold-line"></div>
            <h1 class="title">وكالة وجد</h1>
            <p class="subtitle">شريك هندسة النمو في الخليج</p>
            <div style="margin-top: 40px; font-size: 20px; color: #FFFFFF; opacity: 0.8; font-weight: 300;">
                نُهندس البنية التقنية.. لنُوجد الأثر التسويقي والأرباح الصافية
            </div>
        </div>
        
        <div class="footer-tag">Pitch Deck 2026 • Riyadh • Dubai</div>
    </div>
</body>
</html>
