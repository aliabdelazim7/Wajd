<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Instrument+Sans:wght@400;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #050505; color: #FFFFFF; font-family: 'Tajawal', sans-serif; }
        .slide-container { 
            width: 1280px; 
            min-height: 720px; 
            background: #050505;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .grid-layout {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            width: 100%;
            padding-left: 100px;
            padding-right: 100px;
            gap: 80px;
        }
        .cta-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .eyebrow {
            color: #D4AF37;
            font-family: 'Instrument Sans', sans-serif;
            font-size: 16px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            margin-bottom: 24px;
            display: block;
        }
        .main-hook {
            font-family: 'Playfair Display', serif;
            font-size: 72px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 40px;
            color: #FFFFFF;
        }
        .divider {
            width: 120px;
            height: 2px;
            background: #D4AF37;
            margin-bottom: 40px;
        }
        .description {
            font-size: 22px;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 60px;
            font-weight: 300;
        }
        .contact-info {
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding-top: 30px;
            padding-left: 40px;
            padding-right: 40px;
            min-height: 120px;
        }
        .website-url {
            font-family: 'Instrument Sans', sans-serif;
            font-size: 28px;
            color: #D4AF37;
            font-weight: 600;
            letter-spacing: 0.05em;
        }
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .mockup-container {
            width: 400px;
            height: 550px;
            border: 8px solid #1A1A1A;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 50px 100px rgba(0,0,0,0.5);
            position: relative;
        }
        .mockup-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .footer-note {
            position: absolute;
            bottom: 40px;
            left: 100px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="grid-layout">
            <div class="cta-content">
                <span class="eyebrow">Next Steps</span>
                <h1 class="main-hook">لنبدأ هندسة نموّك اليوم</h1>
                <div class="divider"></div>
                <p class="description">
                    لا تحتاج لميزانيات ضخمة لتبدأ بشكل صحيح. احجز جلستك الاستشارية لنقوم بتشخيص وضعك التقني والإعلاني، ونرسم لك خارطة الطريق نحو أرباح مستدامة.
                </p>
                <div class="contact-info">
                    <p style="font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.2em;">Visit our platform</p>
                    <div class="website-url">www.wajd-agency.com</div>
                </div>
            </div>
            
            <div class="visual-side">
                <div class="mockup-container">
                    <img src="/home/ubuntu/wajd-repo/deck_cover.png" alt="Wajd Agency Interface">
                </div>
            </div>
        </div>
        
        <div class="footer-note">WAJD AGENCY © 2026 • TECH-ENABLED GROWTH PARTNER</div>
    </div>
</body>
</html>
